{{ $intLinkIcon := index hugo.Data.svgicons.icons "internalLink" | safeHTML }}
{{ $link := relLangURL (printf "/mreviews/%s/" (urlize .)) }}
<p class="all-link mb-0">
    <a href="{{ $link }}"
        >All FCG reviews of
        {{ . }} <span class="inline-block ps-1">{{ $intLinkIcon }}</span></a
    >
</p>
