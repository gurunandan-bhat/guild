{{ define "main" }}
    <div class="container">
        {{with resources.Get (printf "images/newsletter/%s" .Params.hdrImage) }}
			{{ with .Process "webp" }}
                <img
                    src="{{ .RelPermalink }}"
                    class="img-fluid w-100 mb-5"
                    alt="FCG Member Reviewer {{ .Title }}" />
            {{ end }}
        {{ end }}
    </div>
    <div class="container">
        <div class="row">
        </div>
    </div>
    <div class="container">
        <h2 class="mb-5 pb-5">FCG Newsletter {{ .Params.issue }}: Special Feature</h2>
        <div class="row">
            <div class="col-lg-2 col-md-2 offset-lg-2">
            </div>
            <div class="col-lg-6 col-md-6">
                <h2>{{ .Title }}</h2>
                <h2 class="newsletter pb-4">&mdash; {{ .Params.author }}</h2>
                {{ .Content }}
            </div>
        </div>
    </div>
{{ end }}
